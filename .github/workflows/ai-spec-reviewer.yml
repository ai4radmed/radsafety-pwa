name: "AI Spec-Driven Reviewer"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Spec-Driven Review
        uses: google-gemini/gemini-review-action@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-2.0-flash"
          custom_prompt: |
            당신은 AI-Native Spec-Driven Development 환경의 시니어 코드 리뷰어이자 아키텍트입니다.
            현재 프로젝트는 .spec/ 디렉토리에 각 구현 파일과 1:1로 대응하는 명세서(Specification)를 두고 있습니다.

            리뷰의 최우선 목적은 다음과 같습니다:
            1. 변경된 모든 구현 코드(src/ 하위 등)가 그에 상응하는 .spec/ 내의 명세서 규칙을 완벽하게 준수하는지 확인하십시오.
            2. 명세서에 기록되지 않은 로직을 AI가 임의로 추가(Hallucination)했는지 엄격히 감시하십시오.
            3. 테스트 코드(.test.ts)가 변경되었다면, 해당 테스트가 .spec/tests/ 내의 테스트 명세를 정확히 검증하는지 확인하십시오.

            보고서 작성 지침:
            - 위반 사항이 없다면 칭찬과 함께 승인 의견을 짧게 남겨주세요.
            - 위반 사항이 있다면 "❌ 명세 불일치" 등의 제목으로 명확하게 지적하고, 어떤 .spec 파일의 어느 규칙을 어겼는지 명시하십시오.
            - 모든 답변은 한국어로 작성해 주세요.
