name: Supabase Keep-Alive

# Supabase 무료 플랜은 7일간 DB/API 무요청이면 프로젝트를 자동 pause 한다.
# 이 앱의 공개 페이지는 MDX 서버렌더라 DB 를 안 건드려서, 단순 열람만으론 pause 를 못 막는다.
# 그래서 월·목 정기적으로 profiles 테이블에 가벼운 anon GET 을 보내 활동을 만든다.
# (anon 은 RLS 로 행을 못 보지만 200 + 빈 배열 = DB 쿼리는 실제 실행됨 → 데이터 유출 0, 활동 발생.
#  glossary_terms/findings 는 라이브 DB schema cache 에 없어 404 → 200 나는 profiles 사용.)
# 최대 간격 3~4일(목→월) < 7일 → pause 안전.

on:
  schedule:
    # 월·목 06:00 UTC (= 15:00 KST)
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}   # 수동 실행(즉시 테스트)용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (profiles)
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY secret 미설정"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP $code"
          head -c 500 /tmp/resp.txt; echo
          # 200(정상) 또는 paused 상태에서의 응답 모두 DB 활동으로 카운트되지만,
          # 깨어 있어야 정상이므로 200 이 아니면 실패로 알림.
          test "$code" = "200"
