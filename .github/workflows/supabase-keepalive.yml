name: Supabase Keep-Alive

# Supabase 무료 플랜은 7일간 DB/API 무요청이면 프로젝트를 자동 pause 한다.
# 이 앱의 공개 페이지는 MDX 서버렌더라 DB 를 안 건드려서, 단순 열람만으론 pause 를 못 막는다.
# 그래서 월·목 정기적으로 anon 공개 테이블 findings(RLS "Anyone can view findings" USING(true))에
# 가벼운 GET 을 보내 DB 활동을 만든다. 최대 간격 3~4일(목→월) < 7일 → pause 안전.

on:
  schedule:
    # 월·목 06:00 UTC (= 15:00 KST)
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}   # 수동 실행(즉시 테스트)용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (findings)
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY secret 미설정"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/findings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP $code"
          head -c 500 /tmp/resp.txt; echo
          # 200 이 아니면(예: pause/키오류) 실패로 알림.
          test "$code" = "200"
