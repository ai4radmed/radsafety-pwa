name: Monthly Manual Check Reminder

# 월간 수동 점검 리마인더 — 매달 텔레그램으로 "점검일" 알림 한 통.
#
# 실제 점검(월간 점검 위저드)은 사람 동석이 필요해 여기서 실행하지 않는다.
# 이 워크플로는 리마인더만 보내고, 점검은 로컬에서 `npm run check:monthly` 로 발화한다.
# (역할 분리: 무인 감시 = health.yml(부작용 0) / 실사용 경로 점검 = 위저드(사람 동석))
#
# 발화 두 경로:
#   1) 자동: 매월 1일 09:00 KST (아래 cron). GitHub cron 은 정시 비보장(지연 정상).
#   2) 수동: gh workflow run monthly-reminder.yml (또는 Actions 탭 "Run workflow") — 예정일이
#      아니어도 언제든. 점검 자체도 리마인더 없이 로컬에서 바로 돌려도 무방하다.
#
# on/off — 저장소 변수 MONTHLY_REMINDER (코드 변경·재배포 불필요):
#   gh variable set MONTHLY_REMINDER --body on    # 기본(미설정 포함) — 매달 발송
#   gh variable set MONTHLY_REMINDER --body off   # 리마인더 끔
#
# 필요한 secret: TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID (health.yml 과 공유.
#   미설정이면 발송 없이 문안만 로그에 남긴다.)
# ※ 크론은 기본 브랜치(main)에서만 발화 → main 머지 후 적용.

on:
    schedule:
        - cron: '0 0 1 * *' # 매월 1일 09:00 KST (00:00 UTC) — UTC = KST − 9h
    workflow_dispatch: {} # 수동 발화(Actions 탭 버튼 / gh workflow run monthly-reminder.yml)

jobs:
    remind:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: 텔레그램 리마인더 발송
              env:
                  MONTHLY_REMINDER: ${{ vars.MONTHLY_REMINDER }}
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
              run: |
                  if [ "$MONTHLY_REMINDER" = "off" ]; then
                      echo "MONTHLY_REMINDER=off — 발송하지 않음"
                      exit 0
                  fi

                  # printf 로 조립: YAML 블록 들여쓰기가 문안에 공백으로 섞이지 않게 한 줄씩 넣는다.
                  TEXT=$(printf '%s\n' \
                      "🧪 RadSafety 월간 수동 점검일입니다" \
                      "" \
                      "로컬 PC에서 한 줄로 시작:" \
                      "npm run check:monthly" \
                      "" \
                      "점검 항목 (약 3분, 개입 3회):" \
                      "① 이메일 OTP 로그인 — 6자리 코드만 입력" \
                      "② 자료실 파일 다운로드 — 자동" \
                      "③ 의견 보내기(Resend 실발송) — 자동" \
                      "④ 푸시 발송 → 휴대폰 수신 확인 — 버튼 클릭" \
                      "⑤ 카카오 로그인 — 버튼 클릭" \
                      "" \
                      "아침 헬스체크가 못 보는 실발송·실수신 경로를 확인합니다.")

                  if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
                      echo "텔레그램 자격증명 미설정 — 문안만 출력:"
                      echo "$TEXT"
                      exit 0
                  fi

                  curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                      -d chat_id="${TELEGRAM_CHAT_ID}" \
                      --data-urlencode text="$TEXT" > /dev/null
                  echo "리마인더 발송 완료"
